<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wow English: Faces, Hair &amp; Have Got</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3a8;--card:#fff;--ink:#14121f;--mut:#5b5870;--pk:#ff7ab8;--cy:#5ce1e6;--li:#b6f23a;--or:#ffa63d;--vi:#9b7bff;--ok:#0b9a5d;--bad:#e0264d;--soft:#f3f0ff;--hd:"Bangers",Impact,"Arial Narrow Bold",sans-serif;--bd:"Comic Neue","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1840;--card:#2a2652;--ink:#fff;--mut:#c4bfe8;--soft:#38336a}}
:root[data-theme="dark"]{--bg:#1b1840;--card:#2a2652;--ink:#fff;--mut:#c4bfe8;--soft:#38336a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:700 18px/1.5 var(--bd);background-image:radial-gradient(#0000001c 2px,transparent 2px);background-size:26px 26px}
button{font:inherit;cursor:pointer;color:var(--ink)}
#fl{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}#fl>*{position:absolute;bottom:-150px;opacity:.9;animation:up linear infinite}
@keyframes up{0%{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(30px,-60vh) rotate(10deg)}100%{transform:translate(-20px,-130vh) rotate(-10deg)}}
@media (prefers-reduced-motion:reduce){#fl>*{animation:none;bottom:20%}}
.fw{font:400 1.4rem var(--hd);letter-spacing:1px;transform:rotate(-6deg);color:var(--ink);text-shadow:2px 2px 0 var(--pk)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:3px solid var(--ink);padding:8px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.logo{font:400 1.7rem var(--hd);letter-spacing:1px}.logo b{color:var(--pk);text-shadow:2px 2px 0 var(--ink)}
.bt{background:var(--cy);border:3px solid var(--ink);border-radius:14px;padding:4px 14px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}.bt:active{transform:translate(3px,3px);box-shadow:0 0 0}
.bt.y{background:var(--or)}.bt.p{background:var(--pk)}.bt.l{background:var(--li)}.bt:disabled{opacity:.4}
.bar{height:16px;border:3px solid var(--ink);border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--li) 0 10px,var(--cy) 10px 20px);transition:width .5s}
#nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}#nav button{background:var(--soft);border:3px solid var(--ink);border-radius:99px;padding:0 13px;font-weight:700}#nav .on{background:var(--pk)}#nav .dn:not(.on){background:var(--li)}
main{max-width:1050px;margin:0 auto;padding:14px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:7px 7px 0 var(--ink);padding:16px 20px;margin:20px 0}
.card h3{margin:0 0 10px;font-size:1.05rem}.tag{display:inline-block;background:var(--vi);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 10px;margin-right:6px;font:400 1.15rem var(--hd);letter-spacing:1px}
h2{font:400 clamp(2rem,6vw,3.2rem)/1 var(--hd);letter-spacing:1px;margin:0}h2 span{color:var(--pk);text-shadow:3px 3px 0 var(--ink)}
.hero{text-align:center}.hero svg{width:min(240px,60vw)}.hero h1{font:400 clamp(2.4rem,9vw,4.6rem)/1 var(--hd);margin:6px 0;letter-spacing:2px}.hero h1 b{color:var(--pk);text-shadow:4px 4px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.chips span{background:var(--li);border:3px solid var(--ink);border-radius:99px;padding:0 14px}.chips span:nth-child(2n){background:var(--cy)}.chips span:nth-child(3n){background:var(--or)}
.chip{background:var(--or);border:3px solid var(--ink);border-radius:12px;padding:0 12px;margin:3px;cursor:grab;box-shadow:2px 2px 0 var(--ink)}.chip.sel{background:var(--pk)}.chip:disabled{opacity:.25;box-shadow:none}.chip.x{text-decoration:line-through;opacity:.5;cursor:default}
.gap{min-width:5.5em;background:var(--soft);border:3px dashed var(--ink);border-radius:10px;padding:0 8px;font-weight:700;margin:0 2px;min-height:1.6em;vertical-align:middle}.gap:not(:empty){border-style:solid;background:#fff;color:#14121f}
.ex{background:#fff176;color:#14121f;border-radius:8px;padding:0 8px;text-decoration:underline}
.in{font:inherit;color:var(--ink);background:var(--soft);border:3px solid var(--ink);border-radius:10px;padding:0 8px;max-width:100%}.in:focus{outline:4px solid var(--cy)}
select.in{padding:2px 6px}
.good{background:#c8f7de!important;border-color:var(--ok)!important;color:#14121f!important}.bad{background:#ffd3dc!important;border-color:var(--bad)!important;color:#14121f!important}
.opt{background:var(--soft);border:3px solid var(--ink);border-radius:10px;padding:0 10px;margin:2px;font-weight:700}.opt.on{background:var(--vi);color:#fff}.opt.on.good{color:#14121f}.opt.on.bad{color:#14121f}
.it{padding:8px 0;border-bottom:3px dotted #0003}.it:last-child{border:0}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pk);color:#14121f;border:3px solid var(--ink);margin-right:6px;font-size:.9rem}
.fb{font-size:.95rem;margin:2px 0 0 36px}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}.fb.key{color:var(--vi)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}@media(max-width:820px){.two{grid-template-columns:1fr}}
.pic{width:100%;border:3px solid var(--ink);border-radius:16px;background:#fff;display:block}
.txt{font-size:1.15rem;line-height:2.2}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.sc{background:var(--li);border:3px solid var(--ink);border-radius:99px;padding:0 14px;color:#14121f}.sc:empty{display:none}
.tok{background:var(--soft);border:3px solid var(--ink);border-radius:12px;padding:0 10px;margin:3px}.tok:disabled{opacity:.2}.zone{min-height:48px;border:3px dashed var(--ink);border-radius:14px;padding:4px;margin:6px 0;background:var(--soft)}.zone .tok{background:var(--cy);color:#14121f}
.snake{display:flex;align-items:center;gap:4px}.snake svg{flex:none;width:76px}.snake div{display:flex;flex-wrap:wrap;gap:3px;background:#ffd89b;border:3px solid var(--ink);border-radius:30px;padding:8px 14px;font:400 1.2rem var(--hd);letter-spacing:3px;color:#14121f}
.nv{display:flex;justify-content:space-between;margin:10px 0 50px}
#rx{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:none;align-items:flex-end;gap:6px;animation:pop .35s}#rx.on{display:flex}#rx svg{width:96px}
#rx p{margin:0 0 40px;background:#fff;color:#14121f;border:3px solid var(--ink);border-radius:16px;padding:6px 14px;font:400 1.4rem var(--hd);letter-spacing:1px;box-shadow:4px 4px 0 var(--ink)}
@keyframes pop{from{transform:scale(.4) translateY(40px);opacity:0}}
#ov{position:fixed;inset:0;background:#000b;z-index:40;display:none;padding:14px;overflow:auto}#ov.on{display:block}#ov .box{max-width:640px;margin:auto;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px}
.oc{border:3px solid var(--ink);border-radius:16px;padding:10px 14px;background:var(--soft)}.oc.dn{background:#c8f7de;color:#14121f}.oc .big{font:400 1.5rem var(--hd);letter-spacing:1px}
</style></head><body><div id="fl"></div>
